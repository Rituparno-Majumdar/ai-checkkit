[build-system]
requires = ["setuptools>=77", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-checkkit"
dynamic = ["version"]
description = "AI-era Python lint bundle: stubcheck + assertcheck + shadowcheck + mutablecheck — catch silent stubs, vanishing asserts, builtin shadowing, mutable defaults"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rituparno Majumdar", email = "majumdarrituparno@gmail.com" }]
keywords = [
    "lint", "ai", "code-quality", "stub", "assert", "shadowing", "mutable",
    "static-analysis", "python", "production", "dead-code",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.scripts]
ai-checkkit = "ai_checkkit.cli:main"
stubcheck = "ai_checkkit.cli:stubcheck_main"
assertcheck = "ai_checkkit.cli:assertcheck_main"
shadowcheck = "ai_checkkit.cli:shadowcheck_main"
mutablecheck = "ai_checkkit.cli:mutablecheck_main"

[project.urls]
Homepage = "https://github.com/Rituparno-Majumdar/ai-checkkit"
Repository = "https://github.com/Rituparno-Majumdar/ai-checkkit"
Changelog = "https://github.com/Rituparno-Majumdar/ai-checkkit/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Rituparno-Majumdar/ai-checkkit#readme"
Issues = "https://github.com/Rituparno-Majumdar/ai-checkkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
write_to = "src/ai_checkkit/_version.py"
fallback_version = "0.1.1.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
